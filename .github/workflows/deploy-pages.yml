name: Deploy MendoraQ to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build C++ WebAssembly app
        shell: bash
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install latest
          "$RUNNER_TEMP/emsdk/emsdk" activate latest
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcc --version
          emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm --target mendoraq_web --parallel
          test -s web/mendoraq.js || { echo "web/mendoraq.js was not generated"; exit 1; }
          test -s web/mendoraq.wasm || { echo "web/mendoraq.wasm was not generated"; exit 1; }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
